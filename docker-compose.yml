services:
  api:
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: maildb
      AMQP_URL: amqp://mail:mail_password@rabbitmq:5672/%2F
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
  consumer:
    build: .
    command: ["python", "-m", "events.consumer"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: maildb
      AMQP_URL: amqp://mail:mail_password@rabbitmq:5672/%2F
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mail
      RABBITMQ_DEFAULT_PASS: mail_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: maildb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./mongodb/data.js:/docker-entrypoint-initdb.d/02-data.js:ro
      - ./mongodb/queries.js:/scripts/queries.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host $$HOSTNAME --quiet --eval 'db.adminCommand({ping: 1})'"]
      interval: 5s
      timeout: 5s
      retries: 20
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maildb
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgresql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U mail -d maildb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
  postgres_data:
  rabbitmq_data:
